# CI wiring (plan.md Phase 5.3): fmt + clippy + tests on every push/PR.
#
# The lint gates mirror the local verification used throughout plan.md
# Phases 1-5: `cargo fmt --check`, `cargo clippy --workspace --all-targets
# -- -D warnings`, `cargo test --workspace`.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
