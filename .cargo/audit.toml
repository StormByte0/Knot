# cargo-audit policy (Fix 4, plan §3.2 step 3).
#
# Advisory below is an "unsound" warning, not an exploitable vulnerability
# in Knot's usage:
[advisories]
ignore = [
    # anyhow 1.0.102 — `Error::downcast_mut()` unsoundness. Knot never calls
    # `downcast_mut` on anyhow errors (grep-verified; error paths only display
    # or log them), so the unsound API is never reachable.
    "RUSTSEC-2026-0190",
    # Post-merge cleanup (2026-10-29): RUSTSEC-2026-0386 (tokio `AsyncFd::new`
    # I/O-safety violation, affected <= 1.52.2) was dropped from this list —
    # the cargo minor-and-patch group moved the lockfile to tokio 1.54.1,
    # which is past the advisory. Verified by running `cargo audit` with the
    # ignore removed: clean. Do not re-add unless tokio regresses below 1.52.3.
]
