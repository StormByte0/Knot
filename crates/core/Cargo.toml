[package]
name = "knot-core"
version.workspace = true
edition.workspace = true

[dependencies]
petgraph = { workspace = true }
ropey = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

# JavaScript parsing via Oxc
oxc_parser = "0.150"
oxc_span = "0.150"
oxc_ast = "0.150"
oxc_allocator = "0.150"
oxc_diagnostics = "0.150"

# CSS parsing via oxc-css-parser — the raffia-based parser maintained by the
# oxc-project org (same ecosystem as the JS side), returning a span-carrying
# AST with recoverable errors. Pinned exact: 0.0.x API churn is real; the
# `css` module's stable types are the isolation boundary so downstream
# callers never see crate types. See plan.md Phase 6.
oxc-css-parser = "=0.0.15"

# HTML parsing via html5gum — WHATWG-compliant tokenizer with byte spans.
# `knot-core` owns a shared `html` module (sibling of `oxc/`) that builds a
# span-carrying CST on top of the token stream; format crates access it on
# demand. See plan.md Phase 2.1 / decision D3.
html5gum = "0.8"
